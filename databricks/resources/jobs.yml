resources:
  jobs:
    lakehouse_batch_pipeline:
      name: ${bundle.target}-lakehouse-batch-pipeline
      description: Generate source data, ingest Bronze, clean Silver, build Gold, load PostgreSQL, and refresh ML forecasts.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      environments:
        - environment_key: lakehouse_python
          spec:
            environment_version: "2"
            dependencies:
              - pydantic==2.8.2
              - pydantic-settings==2.4.0
              - pandas==2.2.2
              - numpy==1.26.4
              - scikit-learn==1.5.1
              - SQLAlchemy==1.4.54
              - psycopg2-binary==2.9.9
      tasks:
        - task_key: generate_sample_data
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - scripts/generate_sample_data.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - DATA_DIR=${var.lakehouse_root}/data
              - --env
              - RAW_DATA_DIR=${var.lakehouse_root}/data/raw
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - CHECKPOINT_DIR=${var.lakehouse_root}/checkpoints
              - --env
              - MODEL_DIR=${var.lakehouse_root}/models

        - task_key: ingest_bronze
          depends_on:
            - task_key: generate_sample_data
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - ingestion/batch_ingestion.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - DATA_DIR=${var.lakehouse_root}/data
              - --env
              - RAW_DATA_DIR=${var.lakehouse_root}/data/raw
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - CHECKPOINT_DIR=${var.lakehouse_root}/checkpoints
              - --env
              - MODEL_DIR=${var.lakehouse_root}/models

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - lakehouse/silver/silver_pipeline.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse

        - task_key: build_gold
          depends_on:
            - task_key: transform_silver
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - lakehouse/gold/gold_pipeline.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse

        - task_key: load_postgres
          depends_on:
            - task_key: build_gold
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - database/load_gold_to_postgres.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - POSTGRES_HOST=${var.postgres_host}
              - --env
              - POSTGRES_DB=${var.postgres_db}
              - --env
              - POSTGRES_USER=${var.postgres_user}
              - --secret-env
              - POSTGRES_PASSWORD=lakehouse/postgres_password
              - --env
              - POSTGRES_SSLMODE=${var.postgres_sslmode}

        - task_key: train_demand_forecast
          depends_on:
            - task_key: transform_silver
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - ml/train_demand_forecast.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - MODEL_DIR=${var.lakehouse_root}/models

        - task_key: predict_demand
          depends_on:
            - task_key: train_demand_forecast
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - ml/predict_demand.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - MODEL_DIR=${var.lakehouse_root}/models

    lakehouse_realtime_metrics_stream:
      name: ${bundle.target}-lakehouse-realtime-metrics-stream
      description: Continuously read Kafka events and write Gold real-time Delta metrics.
      environments:
        - environment_key: lakehouse_python
          spec:
            environment_version: "2"
            dependencies:
              - pydantic==2.8.2
              - pydantic-settings==2.4.0
      tasks:
        - task_key: realtime_metrics
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - streaming/realtime_aggregations.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - CHECKPOINT_DIR=${var.lakehouse_root}/checkpoints
              - --env
              - KAFKA_BOOTSTRAP_SERVERS=${var.kafka_bootstrap_servers}

    lakehouse_realtime_loader:
      name: ${bundle.target}-lakehouse-realtime-loader
      description: Periodically load Gold real-time metrics from Delta to PostgreSQL.
      schedule:
        quartz_cron_expression: "0 0/1 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      environments:
        - environment_key: lakehouse_python
          spec:
            environment_version: "2"
            dependencies:
              - pydantic==2.8.2
              - pydantic-settings==2.4.0
              - pandas==2.2.2
              - SQLAlchemy==1.4.54
              - psycopg2-binary==2.9.9
      tasks:
        - task_key: load_realtime_metrics
          environment_key: lakehouse_python
          spark_python_task:
            python_file: ../../databricks/run_with_env.py
            parameters:
              - --script
              - streaming/load_realtime_to_postgres.py
              - --env
              - ENVIRONMENT=databricks
              - --env
              - WAREHOUSE_DIR=${var.lakehouse_root}/warehouse
              - --env
              - POSTGRES_HOST=${var.postgres_host}
              - --env
              - POSTGRES_DB=${var.postgres_db}
              - --env
              - POSTGRES_USER=${var.postgres_user}
              - --secret-env
              - POSTGRES_PASSWORD=lakehouse/postgres_password
              - --env
              - POSTGRES_SSLMODE=${var.postgres_sslmode}
